name: Build MusicHub APK and AAB
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
      - name: Install uploaded MusicHub launcher icon
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          cp icon.png app/src/main/res/drawable-nodpi/ic_launcher.png
          file app/src/main/res/drawable-nodpi/ic_launcher.png
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Build release Android App Bundle
        run: gradle bundleRelease --no-daemon --stacktrace
      - name: Report output sizes
        run: |
          echo "Debug APK:"
          du -h app/build/outputs/apk/debug/*.apk
          echo "Release AAB:"
          du -h app/build/outputs/bundle/release/*.aab
      - uses: actions/upload-artifact@v4
        with:
          name: musichub-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: musichub-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
